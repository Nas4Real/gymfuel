<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#08111f">
    <meta name="referrer" content="no-referrer">
    <title>GymFuel account confirmation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body class="landing-page">
    <main class="page-shell">
      <header class="brand" aria-label="GymFuel">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span>GymFuel</span>
      </header>

      <section class="result-card landing-card" aria-labelledby="landing-title">
        <div class="eyebrow">
          <span class="eyebrow-dot" aria-hidden="true"></span>
          Secure account confirmation
        </div>
        <div class="state-icon state-icon-neutral" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M7 10V8a5 5 0 0 1 10 0v2"></path>
            <rect x="5" y="10" width="14" height="10" rx="3"></rect>
            <path d="M12 14v2"></path>
          </svg>
        </div>
        <p class="state-label">GymFuel account security</p>
        <h1 id="landing-title">Open your confirmation email</h1>
        <p class="result-message">
          This page displays the result after Supabase securely verifies a GymFuel email address.
        </p>
        <div class="security-note">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 12 2 2 4-5"></path>
            <path d="M12 3 5 6v5c0 4.6 2.9 8.1 7 10 4.1-1.9 7-5.4 7-10V6l-7-3Z"></path>
          </svg>
          No password or private nutrition data is handled here.
        </div>
      </section>

      <footer class="site-footer">Personal nutrition, securely in sync.</footer>
    </main>
  </body>
</html>
